name: Lint

on:
    push:
    pull_request:

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Run actionlint
              uses: raven-actions/actionlint@v2

            - name: Install Nix
              uses: DeterminateSystems/nix-installer-action@main

            - name: Check flake inputs
              uses: DeterminateSystems/flake-checker-action@main
              with:
                  flake-lock-path: flake.lock

            - name: Check flake
              run: nix flake check

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true

            - name: Sync python dev deps
              working-directory: scripts
              run: uv sync --group dev

            - name: ruff check
              working-directory: scripts
              run: uv run ruff check

            - name: ruff format --check
              working-directory: scripts
              run: uv run ruff format --check

            - name: basedpyright
              working-directory: scripts
              run: uv run basedpyright

            - name: pytest
              working-directory: scripts
              run: uv run pytest -q

    auto-merge:
        needs: lint
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'automation/') && github.base_ref == github.event.repository.default_branch && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - run: gh pr merge "${{ github.event.pull_request.number }}" --merge --delete-branch --match-head-commit "${{ github.event.pull_request.head.sha }}" --repo "${{ github.repository }}"
              env:
                  GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
