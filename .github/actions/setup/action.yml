name: Setup CI environment
description: >
  Shared CI setup: installs Nix, restores Nix and Cargo caches, and configures
  sccache's GitHub Actions cache backend.

inputs:
  cargo-cache-prefix:
    description: >
      Prefix for Cargo cache keys, e.g. "x86_64-unknown-linux-gnu".
    required: true

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@v31

    - name: Cache Nix store
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size-linux: 5G
        purge: true
        purge-prefixes: nix-${{ runner.os }}-
        purge-created: 0
        purge-primary-key: never

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: ${{ inputs.cargo-cache-prefix }}-ci

    # sccache itself comes from the nix devshell. Its GHA cache backend needs
    # these runtime values, which are only visible to JavaScript actions.
    # ACTIONS_CACHE_SERVICE_V2 selects the current cache API; without it,
    # sccache falls back to the retired v1 service.
    - name: Configure sccache
      uses: actions/github-script@v9
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
